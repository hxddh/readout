name: DIAG smoke input-delay probe (temporary)
on:
  push:
    branches: ['m16/smoke-l2inj']
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        inject: ['1', '0']
    runs-on: macOS-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build
        run: |
          set -eo pipefail
          brew install xcodegen
          (cd web && npm ci --no-audit --no-fund > /dev/null && npm run build > /dev/null)
          xcodegen generate > /dev/null
          xcodebuild -project Readout.xcodeproj -scheme Readout -configuration Release -derivedDataPath build \
            -destination 'generic/platform=macOS' MARKETING_VERSION=9.9.9 CURRENT_PROJECT_VERSION=999 ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build > xcb.log 2>&1 || { grep -E "error" xcb.log | head -20; exit 1; }
          rm -rf /Applications/Readout.app
          ditto build/Build/Products/Release/Readout.app /Applications/Readout.app
          sh tools/sign.sh /Applications/Readout.app "-"
      - name: Smoke
        env:
          READOUT_SMOKE_INJECT: ${{ matrix.inject }}
        run: |
          python3 tools/smoke-run.py /Applications/Readout.app/Contents/MacOS/Readout "$RUNNER_TEMP/smoke" smoke-out > smoke.txt 2>&1 || true
          grep -o "cold_post_paint_input_delay[a-z_]*': [0-9.None]*" smoke.txt | sort -u
          grep -h "ABINJECT" smoke-out/*.log smoke-out/boot/*.log 2>/dev/null | head
