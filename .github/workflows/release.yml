name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Tag pushes build the tag; manual runs build the selected branch and create the tag on release.
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
          fetch-depth: 0

      - name: Version
        run: |
          VERSION="${TAG#v}"
          BUILD=$(git rev-list --count HEAD)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web renderer
        working-directory: web
        run: npm ci && npm run build

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Readout.xcodeproj -scheme Readout -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | xcbeautify --renderer github-actions
          mkdir -p dist
          ditto build/Build/Products/Release/Readout.app dist/Readout.app

      - name: Sign
        run: |
          chmod +x tools/sign.sh
          tools/sign.sh dist/Readout.app "${IDENTITY:--}"

      - name: Notarize app
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent dist/Readout.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Readout.app

      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent Readout.app "Readout-$VERSION.zip"
          mkdir dmg && cp -R Readout.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Readout" -srcfolder dmg -ov -format UDZO "Readout-$VERSION.dmg"
          rm -rf dmg
          if [ -n "${IDENTITY:-}" ]; then codesign --sign "$IDENTITY" --timestamp "Readout-$VERSION.dmg"; fi

      - name: Notarize disk image
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "dist/Readout-$VERSION.dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/Readout-$VERSION.dmg"

      - name: Appcast
        if: env.HAS_SPARKLE_KEY == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 -m pip install --quiet --break-system-packages cryptography || python3 -m pip install --quiet cryptography
          python3 tools/appcast.py "dist/Readout-$VERSION.zip" "$VERSION" "$BUILD" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/Readout-$VERSION.zip" \
            "https://github.com/${{ github.repository }}/releases/tag/$TAG" "26.0" dist/appcast.xml

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/$VERSION.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          FILES="dist/Readout-$VERSION.dmg dist/Readout-$VERSION.zip"
          [ -f dist/appcast.xml ] && FILES="$FILES dist/appcast.xml"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "Readout $VERSION" --notes-file "$NOTES" --target "$(git rev-parse HEAD)"
          fi
