name: Release

# v1.0.0 crashed at launch because CI only ever booted a Debug build while
# users received a re-signed Release bundle. v1.0.1 then shipped while Core
# tests were red because releasing never depended on CI. This workflow fixes
# both: preflight gates the tag, verify.yml boots the signed Release product
# and asserts on it, and publish ships ONLY verify's artifact.
#
# Sparkle is intentionally NOT in this app. It was removed in 1.0.1 because
# its embedded framework must be signed with the same Developer ID identity
# as the host app: ad-hoc or mismatched signatures are refused by dyld
# library validation at launch. Updates are checked against the GitHub
# Releases API instead, so there is no signing relationship to keep in
# sync — do not re-add a bundled updater without a Developer ID setup.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-run release for (must already exist; never creates one)"
        required: true
      dry_run:
        description: "Run preflight + verify but do not publish"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      build: ${{ steps.tag.outputs.build }}
      sha: ${{ steps.tag.outputs.sha }}
      dry_run: ${{ steps.tag.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          # Dispatch runs on main: the tag's existence is checked in the next
          # step with a clear error (checking out a missing tag's ref here
          # would fail cryptically inside the checkout action).
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}

      - name: Resolve tag and dry_run
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            DRY=false
          else
            TAG="${{ inputs.tag }}"
            DRY="${{ inputs.dry_run }}"
            git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null \
              || { echo "FAIL: tag $TAG does not exist; dispatch only re-runs existing tags"; exit 1; }
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          case "$VERSION" in
            *-*|*+*|"") echo "FAIL: tag '$TAG' is not a plain vX.Y.Z release tag"; exit 1;;
          esac
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "FAIL: tag '$TAG' is not vX.Y.Z"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          SHA=$(git rev-list -n 1 "$TAG")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count "$SHA")" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG version=$VERSION sha=$SHA dry_run=$DRY"
          # Dispatch checked out main above: move the working tree onto the
          # tag so the file checks below read the tagged commit.
          if [ "${{ github.event_name }}" != "push" ]; then git checkout "$SHA"; fi

      - name: Version must exceed the latest published Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          LATEST=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          echo "latest published: ${LATEST:-none}"
          python3 - "$VERSION" "${LATEST#v}" <<'EOF'
          import re, sys
          def parts(v):
              m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", v)
              assert m, f"not semver: {v}"
              return tuple(int(x) for x in m.groups())
          new, old = parts(sys.argv[1]), parts(sys.argv[2]) if sys.argv[2] else (0, 0, 0)
          if not (new > old):
              sys.exit(f"FAIL: {sys.argv[1]} is not newer than latest {sys.argv[2]}")
          print(f"ok: {sys.argv[1]} > {sys.argv[2] or 'nothing'}")
          EOF

      - name: Release notes must exist and be non-empty
        run: |
          NOTES="docs/releases/${{ steps.tag.outputs.version }}.md"
          [ -s "$NOTES" ] || { echo "FAIL: $NOTES is missing or empty"; exit 1; }
          echo "ok: $NOTES ($(wc -c < "$NOTES") bytes)"

      - name: MARKETING_VERSION must equal the tag
        run: |
          MV=$(grep -E '^\s*MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          [ "$MV" = "${{ steps.tag.outputs.version }}" ] \
            || { echo "FAIL: project.yml MARKETING_VERSION=$MV != tag ${{ steps.tag.outputs.version }}"; exit 1; }
          echo "ok: MARKETING_VERSION=$MV"

      - name: Tag must be an ancestor of main
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "${{ steps.tag.outputs.sha }}" origin/main \
            || { echo "FAIL: ${{ steps.tag.outputs.tag }} is not on main"; exit 1; }
          echo "ok: tag is on main"

      - name: CI must be green on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ steps.tag.outputs.sha }}"
          echo "checking CI (ci.yml) on $SHA"
          # Note: jobs from the called verify.yml surface as
          # "Verify signed product / Build, sign and smoke test", so match by substring.
          # (gh api has no --arg flag: interpolate the name into the -q query.)
          for NAME in "Core tests (Linux)" "Web tests (WebKit)" "Verify signed product"; do
            C=$(gh api "repos/{owner}/{repo}/commits/$SHA/check-runs" -q \
              "[.check_runs[] | select(.name | contains(\"$NAME\"))][0].conclusion" 2>/dev/null || echo "")
            echo "$NAME: ${C:-unknown}"
            [ "$C" = "success" ] || { echo "FAIL: '$NAME' is not success on $SHA"; exit 1; }
          done
          echo "ok: CI is green on $SHA"

  verify:
    name: Verify what will ship
    needs: preflight
    uses: ./.github/workflows/verify.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      build: ${{ needs.preflight.outputs.build }}
      configuration: Release

  publish:
    name: Publish the verified artifact
    needs: [preflight, verify]
    if: needs.preflight.outputs.dry_run != 'true'
    runs-on: macos-26
    env:
      TAG: v${{ needs.preflight.outputs.version }}
      VERSION: ${{ needs.preflight.outputs.version }}
      EXPECTED_SHA: ${{ needs.verify.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download the verified artifact
        uses: actions/download-artifact@v5
        with:
          name: readout-app-${{ needs.preflight.outputs.version }}
          path: dist

      - name: SHA-256 must match verify's output
        run: |
          GOT=$(shasum -a 256 "dist/readout-app-$VERSION.zip" | cut -d' ' -f1)
          echo "verify said: $EXPECTED_SHA"
          echo "downloaded:  $GOT"
          [ "$GOT" = "$EXPECTED_SHA" ] || { echo "FAIL: artifact changed after verify"; exit 1; }

      - name: Unpack, build DMG, write SHA256SUMS
        run: |
          rm -rf dist/Readout.app
          ditto -x -k dist/readout-app-"$VERSION".zip dist/
          cd dist
          mv "readout-app-$VERSION.zip" "Readout-$VERSION.zip"
          mkdir dmg && cp -R Readout.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Readout" -srcfolder dmg -ov -format UDZO "Readout-$VERSION.dmg"
          rm -rf dmg
          shasum -a 256 "Readout-$VERSION.dmg" "Readout-$VERSION.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft release and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/$VERSION.md"
          # Idempotent: a retried run reuses the draft left by the previous
          # attempt instead of failing on the already-existing release.
          if gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null | grep -q true; then
            echo "reusing existing draft $TAG"
            gh release upload "$TAG" "dist/Readout-$VERSION.dmg" "dist/Readout-$VERSION.zip" "dist/SHA256SUMS" --clobber
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "FAIL: $TAG is already published (not a draft); refusing to overwrite a published release"
            exit 1
          else
            gh release create "$TAG" "dist/Readout-$VERSION.dmg" "dist/Readout-$VERSION.zip" "dist/SHA256SUMS" \
              --title "Readout $VERSION" --notes-file "$NOTES" --target "${{ needs.preflight.outputs.sha }}" --draft
          fi

      - name: Re-download the ZIP and verify its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXPECTED=$(grep "Readout-$VERSION.zip" dist/SHA256SUMS | cut -d' ' -f1)
          gh release download "$TAG" -p "Readout-$VERSION.zip" -D redownload
          GOT=$(shasum -a 256 "redownload/Readout-$VERSION.zip" | cut -d' ' -f1)
          echo "published:   $EXPECTED"
          echo "downloaded:  $GOT"
          [ "$GOT" = "$EXPECTED" ] || { echo "FAIL: uploaded ZIP does not match"; exit 1; }

      - name: Publish (undraft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false
