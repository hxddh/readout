name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

# Sparkle is intentionally NOT in this app. It was removed in 1.0.1 because
# its embedded XPC services must be signed with the same Developer ID as the
# host app: ad-hoc or mismatched signatures crash at launch while dyld loads
# the framework. Updates are checked against the GitHub Releases API instead,
# so there is no signing relationship to keep in sync — do not re-add a
# bundled updater without a Developer ID signing setup.

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Tag pushes build the tag; manual runs build the selected branch and create the tag on release.
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
          fetch-depth: 0

      - name: Version
        run: |
          VERSION="${TAG#v}"
          BUILD=$(git rev-list --count HEAD)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web renderer
        working-directory: web
        run: npm ci && npm run build

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Readout.xcodeproj -scheme Readout -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | xcbeautify --renderer github-actions
          mkdir -p dist
          ditto build/Build/Products/Release/Readout.app dist/Readout.app

      - name: Sign (ad-hoc, hardened runtime)
        # No Developer ID certificate is configured: sign ad-hoc with the
        # hardened runtime so the app runs on the local machine and CI.
        # Every nested executable gets the same "-" identity as the host app,
        # which is what keeps dyld library validation happy.
        run: |
          chmod +x tools/sign.sh
          tools/sign.sh dist/Readout.app "-"

      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent Readout.app "Readout-$VERSION.zip"
          mkdir dmg && cp -R Readout.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Readout" -srcfolder dmg -ov -format UDZO "Readout-$VERSION.dmg"
          rm -rf dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/$VERSION.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          FILES="dist/Readout-$VERSION.dmg dist/Readout-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "Readout $VERSION" --notes-file "$NOTES" --target "$(git rev-parse HEAD)"
          fi
