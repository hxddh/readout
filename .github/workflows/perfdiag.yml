name: perfdiag
on:
  push:
    branches: [m15/perfdiag]
jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        harness: [main, fixed]
        n: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 300 }
      - name: overlay
        run: |
          cp tools/perfdiag/perf-fixed.mjs /tmp/
          git checkout -q 5c445ef -- web
          if [ "${{ matrix.harness }}" = fixed ]; then cp /tmp/perf-fixed.mjs web/test/perf.test.mjs; fi
          git diff --stat HEAD -- web/test/perf.test.mjs
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - working-directory: web
        run: npm ci && npm run build && npx playwright install --with-deps webkit
      - name: cpu
        run: lscpu | grep -i 'model name'
      - name: perf x6
        working-directory: web
        run: for i in $(seq 6); do node test/perf.test.mjs | grep -E 'web_update_20|web_first_apply_1mb_ms'; echo ----; done
  mini:
    strategy:
      fail-fast: false
      matrix:
        ref: [fc48b78, 5c445ef]
        n: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 300 }
      - name: overlay
        run: |
          cp tools/perfdiag/mini.mjs tools/perfdiag/instr.py /tmp/
          git checkout -q ${{ matrix.ref }} -- web
          python3 /tmp/instr.py web/src/reader/patch.js
          cp /tmp/mini.mjs web/test/perfdiag.mjs
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - working-directory: web
        run: npm ci && npm run build && npx playwright install --with-deps webkit
      - name: cpu
        run: lscpu | grep -i 'model name'
      - name: mini plain x16 (no probes)
        working-directory: web
        run: for i in $(seq 16); do node test/perfdiag.mjs; done
