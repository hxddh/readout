name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test --package-path Packages/ReadoutCore

  webkit:
    name: Web tests (WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web renderer
        working-directory: web
        run: npm ci && npm run build
      - name: Install WebKit
        working-directory: web
        run: npx playwright install --with-deps webkit
      - name: Patch-engine tests (WebKit)
        working-directory: web
        run: npm test
        env:
          BROWSER: webkit

  corpus:
    name: Rendering baselines (WebKit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web renderer
        working-directory: web
        run: npm ci && npm run build
      - name: Install WebKit
        working-directory: web
        run: npx playwright install --with-deps webkit
      - name: Corpus snapshots and screenshots
        working-directory: web
        run: npm run corpus
      - name: Upload actual renderings, diffs and full pages
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: corpus-actual
          path: web/test/out/corpus
          retention-days: 14

  verify:
    name: Verify signed product
    needs: [core, webkit]
    uses: ./.github/workflows/verify.yml
    with:
      version: 0.0.0-ci
      build: ci
      configuration: Release
