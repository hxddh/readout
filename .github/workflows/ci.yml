name: CI
on:
  workflow_dispatch:
    inputs:
      commits:
        type: string
        default: ""
      specs:
        type: string
        default: ""
jobs:
  scroll:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deps
        working-directory: web
        run: npm ci && npm i --no-save @shikijs/langs-precompiled@4.5.0 && npx playwright install --with-deps webkit
      - name: Baselines
        env:
          COMMITS: ${{ inputs.commits }}
          SPECS: ${{ inputs.specs }}
          PASS_MS: "8000"
          SCROLL_ONLY: "1"
        run: |
          [ -z "$COMMITS" ] && unset COMMITS; [ -z "$SPECS" ] && unset SPECS
          exp/run.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: scroll-${{ matrix.os }}
          path: exp/out
