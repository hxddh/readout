name: CI

on:
  push:
    branches: [main]
  # Draft PRs run nothing (the Changed paths job is skipped, so every job
  # after it is too); marking one ready runs it. Policy: docs/TESTING.md.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      notarize:
        description: "Notarization check: verify signs with the Developer ID, notarizes and staples the app and DMG (publishes nothing; ad hoc when the secrets are not set)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides what a pull request needs (docs/TESTING.md, "What CI runs").
  # A push to main and a dispatch always get everything: release.yml's
  # preflight requires that push run's Core, WebKit, Rendering baselines and
  # Verify jobs to have succeeded, so nothing here may skip them there.
  # Anything unexpected (no merge commit, a failed diff, an empty diff)
  # runs everything.
  changes:
    name: Changed paths
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      linux: ${{ steps.classify.outputs.linux }}
      verify: ${{ steps.classify.outputs.verify }}
    steps:
      # The PR's merge commit and both its parents: the base tip is ^1.
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - name: Classify
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          PAYLOAD_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'verify') }}
        run: |
          set -euo pipefail
          out() { echo "linux=$1" >> "$GITHUB_OUTPUT"; echo "verify=$2" >> "$GITHUB_OUTPUT"; echo "linux=$1 verify=$2 ($3)" | tee -a "$GITHUB_STEP_SUMMARY"; }
          if [ "$EVENT" != "pull_request" ]; then out true true "$EVENT: everything runs"; exit 0; fi
          # The label is read live, so re-running all jobs after adding it works.
          LABELS=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name' 2>/dev/null) || LABELS=""
          if [ "$PAYLOAD_LABEL" = "true" ] || grep -qx verify <<< "$LABELS"; then
            out true true "label verify"; exit 0
          fi
          # --no-renames: a file moved into docs/ also lists the path it left.
          if ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null || ! FILES=$(git diff --no-renames --name-only 'HEAD^1' HEAD) || [ -z "$FILES" ]; then
            out true true "could not list the changed files"; exit 0
          fi
          printf '%s\n' "$FILES" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          linux=false; verify=false
          while IFS= read -r f; do
            # Linux jobs skip only docs (but not docs/releases/, which Core
            # tests and release preflight read) and top-level Markdown.
            case "$f" in
              docs/releases/*) linux=true ;;
              docs/*) ;;
              */*) linux=true ;;
              *.md) ;;
              *) linux=true ;;
            esac
            # Verify skips docs, top-level Markdown, web tests and the speed
            # budgets, except the web/test files the smoke test itself opens.
            case "$f" in
              web/test/fixtures/plan*|web/test/fixtures/missing-diagram.png|web/test/corpus/01-sdd-fix-loop-plan.md) verify=true ;;
              docs/*|web/test/*|tools/perf-budgets.json) ;;
              */*) verify=true ;;
              *.md) ;;
              *) verify=true ;;
            esac
          done <<< "$FILES"
          out "$linux" "$verify" "changed paths"

  core:
    name: Core tests (Linux)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test --package-path Packages/ReadoutCore
      - name: Instructions and page payload (1 MB, valgrind)
        run: |
          apt-get update -qq && apt-get install -y -qq valgrind python3 > /dev/null
          swift build -c release --package-path Packages/ReadoutCore --product perf-probe
          probe=Packages/ReadoutCore/.build/release/perf-probe
          n=$(sh Packages/ReadoutCore/Tools/perf-instructions.sh $probe web/test/corpus 1000000 update)
          a=$(sh Packages/ReadoutCore/Tools/perf-instructions.sh $probe web/test/corpus 1000000 append)
          t=$(sh Packages/ReadoutCore/Tools/perf-instructions.sh $probe web/test/corpus 1000000 tail)
          o=$(sh Packages/ReadoutCore/Tools/perf-instructions.sh $probe web/test/corpus 1000000 open-unique)
          d=$(sh Packages/ReadoutCore/Tools/perf-instructions.sh $probe web/test/corpus 1000000 mid)
          b=$($probe web/test/corpus 1000000 bytes append)
          echo "perf instructions: update_1mb $n, append_1mb $a, tail_1mb $t, mid_1mb $d, open_1mb_unique $o; append page payload $b bytes"
          python3 -c 'import json, sys; m = lambda v: round(int(v) / 1e6, 1); json.dump({"update_1mb_minstr": m(sys.argv[1]), "append_1mb_minstr": m(sys.argv[2]), "open_1mb_unique_minstr": m(sys.argv[3]), "append_patch_bytes_1mb": int(sys.argv[4]), "tail_1mb_minstr": m(sys.argv[5]), "mid_1mb_minstr": m(sys.argv[6])}, open("perf-instr.json", "w"))' "$n" "$a" "$o" "$b" "$t" "$d"
          python3 tools/perf-assert.py linux-callgrind perf-instr.json

  webkit:
    name: Web tests (WebKit)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build readout-dump in the background (copy round trips)
        run: nohup swift build --package-path Packages/ReadoutCore --product readout-dump > "$RUNNER_TEMP/readout-dump.log" 2>&1 &
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web renderer
        working-directory: web
        run: npm ci && npm run build
      - name: Install WebKit
        working-directory: web
        run: npx playwright install --with-deps webkit
      - name: Patch-engine tests (WebKit)
        working-directory: web
        run: npm test
        env:
          BROWSER: webkit
      - name: Page speed (1 MB document)
        working-directory: web
        run: node test/perf.test.mjs && python3 ../tools/perf-assert.py linux-webkit test/out/perf-web.json
      - name: Upload page speed
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: perf-web
          path: web/test/out/perf-web.json
          retention-days: 30

  corpus:
    name: Rendering baselines (WebKit)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web renderer
        working-directory: web
        run: npm ci && npm run build
      - name: Install WebKit
        working-directory: web
        run: npx playwright install --with-deps webkit
      - name: Corpus snapshots and screenshots
        working-directory: web
        run: npm run corpus
      # The documents with diagrams, formulas and long code blocks, each
      # rendered three times: every render the same, or the page is not
      # deterministic (a lazy renderer settling differently between runs).
      - name: Deterministic rendering (diagrams, formulas, long code; 3 renders)
        working-directory: web
        run: node test/corpus.test.mjs --repeat=3 20-aios,21-dropout,29-a2a
      - name: Upload actual renderings, diffs and full pages
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: corpus-actual
          path: web/test/out/corpus
          retention-days: 14

  verify:
    name: Verify signed product
    # Always on push to main and dispatch; on a PR only when Changed paths
    # says so (macOS minutes cost about 10x Linux ones).
    needs: [changes, core, webkit]
    if: ${{ needs.changes.outputs.verify == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.notarize) }}
    uses: ./.github/workflows/verify.yml
    with:
      version: 0.0.0-ci
      build: ci
      configuration: Release

  # Actions ▸ CI ▸ Run workflow ▸ notarize: the notarization lane on this
  # commit, end to end, without a release (docs/RELEASING.md). Only a dispatch
  # by someone with write access gets here; pull requests and pushes never
  # pass secrets to verify.
  notarize-check:
    name: Notarization check
    needs: [core, webkit]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.notarize }}
    uses: ./.github/workflows/verify.yml
    with:
      version: 0.0.0-notarize
      build: ci
      configuration: Release
      notarize: true
    secrets: inherit
