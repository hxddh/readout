name: Perf isolation 8 (temporary, #99)
on:
  push:
    branches: [exp/p4-ab10]
jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [zwsp, zwsp_tint, zwsp_noadjust, zwsp_both]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build main and the variant
        env:
          V: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add "$RUNNER_TEMP/M" origin/main
          git worktree add "$RUNNER_TEMP/X" HEAD^
          css="$RUNNER_TEMP/X/web/src/reader.css"
          python3 - "$V" "$RUNNER_TEMP/X/web/test/corpus/patches" <<'PY'
          import json, glob, re, sys
          v, d = sys.argv[1], sys.argv[2]
          n = 0
          for f in glob.glob(d + '/*.json'):
              p = json.load(open(f))
              for o in p['ops']:
                  h = o.get('html')
                  if not h: continue
                  if v == 'nowbr': h2 = h.replace('<wbr>', '')
                  elif v == 'nonb': h2 = re.sub(r'<span class="nb">(.*?)</span>', r'\1', h).replace('<code class="nb">', '<code>')
                  elif v == 'nolead': h2 = h.replace('<p class="lead">', '<p>')
                  elif v in ('t30', 'zwsp30'):
                      sep = '\u200b' if v == 'zwsp30' else '<wbr>'
                      def fix(m):
                          inner = m.group(2)
                          def tok(t):
                              plain = re.sub(r'<[^>]+>', '', t.group(0))
                              return t.group(0) if len(plain) >= 30 and v == 't30' else (t.group(0).replace('<wbr>', sep) if len(plain) >= 30 else t.group(0).replace('<wbr>', ''))
                          return m.group(1) + re.sub(r'(?:<[^>]*>|[^ <])+', tok, inner) + m.group(3)
                      h2 = re.sub(r'(<code[^>]*>)(.*?)(</code>)', fix, h)
                  elif v == 'para': h2 = h if o.get('kind') == 'paragraph' else re.sub(r'<code[^>]*>.*?</code>', lambda m: m.group(0).replace('<wbr>', ''), h)
                  elif v == 'zwspcode': h2 = re.sub(r'<code[^>]*>.*?</code>', lambda m: m.group(0).replace('<wbr>', '\u200b'), h)
                  elif v.startswith('zwsp_') or v == 'zwsp': h2 = h.replace('<wbr>', '\u200b')
                  elif v == 'nowbrcode': h2 = re.sub(r'<code[^>]*>.*?</code>', lambda m: m.group(0).replace('<wbr>', ''), h)
                  else: h2 = h
                  n += h2 != h
                  o['html'] = h2
              json.dump(p, open(f, 'w'))
          print(v, 'ops changed', n)
          PY
          if [ "$V" = zwsp_tint ] || [ "$V" = zwsp_both ]; then grep -q 'background: color-mix(in srgb, var(--text) var(--code-tint), transparent);' "$css"; sed -i 's|background: color-mix(in srgb, var(--text) var(--code-tint), transparent);|background: var(--code-fill);|' "$css"; printf ':root { --code-fill: rgb(29 29 31 / 3%%); } :root[data-theme="dark"] { --code-fill: rgb(232 232 234 / 5%%); } @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --code-fill: rgb(232 232 234 / 5%%); } }\n' >> "$css"; tail -2 "$css"; fi
          if [ "$V" = zwsp_noadjust ] || [ "$V" = zwsp_both ]; then grep -q 'font-size-adjust: ex-height 0.53;' "$css"; sed -i '/^  font-size-adjust: ex-height 0.53;$/d' "$css"; fi
          if [ "$V" = noclone ]; then grep -q 'box-decoration-break: clone;' "$css"; sed -i '/box-decoration-break: clone;/d' "$css"; fi
          if [ "$V" = noleadcss ]; then grep -q 'p.lead + :is(ul, ol)' "$css"; sed -i '/p.lead + :is(ul, ol)/d; /lead-list { --flow/d' "$css"; fi
          (cd "$RUNNER_TEMP/X" && git diff --stat | cat)
          (cd "$RUNNER_TEMP/X" && git diff --stat | cat)
          for s in M X; do (cd "$RUNNER_TEMP/$s/web" && npm ci && npm run build); done
          (cd "$RUNNER_TEMP/X/web" && npx playwright install --with-deps webkit)
      - name: "Interleaved runs (M X X M M X)"
        run: |
          set -uo pipefail
          mkdir -p out
          n=0
          for s in M X X M M X; do
            n=$((n+1))
            (cd "$RUNNER_TEMP/$s/web" && node test/perf.test.mjs > "$GITHUB_WORKSPACE/out/$n-$s.log" 2>&1); echo "run $n $s exit $?"
            cp "$RUNNER_TEMP/$s/web/test/out/perf-web.json" "out/$n-$s.json" || true
          done
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: perf-iso-${{ matrix.variant }}
          path: out/
