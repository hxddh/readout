name: Verify signed product

# Builds exactly what Release builds, signs it with tools/sign.sh, boots the
# signed app from /Applications, asserts on its smoke output, and uploads the
# signed app zip. Release publishes ONLY this artifact — it never rebuilds.
#
# The disk image (dmgbuild: the app, an Applications link, a 2x background with
# an arrow and, while not notarized, the first-open hint) is built here from the
# tested app and checked, and publish ships it byte for byte.
#
# Notarization (dormant until the six secrets below exist; docs/RELEASING.md):
# with `notarize: true` AND every secret set, the app is signed with the
# Developer ID instead of ad hoc, notarized and stapled BEFORE the smoke test,
# and the DMG is signed, notarized and stapled here too, so what ships is what
# was tested. Without the secrets (ci.yml, forks, today) NOTARIZE is false and
# the app and the disk image are ad hoc.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build:
        required: true
        type: string
      configuration:
        required: false
        default: Release
        type: string
      notarize:
        description: Sign with the Developer ID, notarize and staple (only when the secrets exist)
        required: false
        default: false
        type: boolean
    secrets:
      DEVELOPER_ID_P12_BASE64:
        required: false
      DEVELOPER_ID_P12_PASSWORD:
        required: false
      DEVELOPER_ID_IDENTITY:
        required: false
      NOTARY_API_KEY_P8_BASE64:
        required: false
      NOTARY_API_KEY_ID:
        required: false
      NOTARY_API_ISSUER_ID:
        required: false
    outputs:
      sha256:
        description: SHA-256 of the uploaded readout-app-<version>.zip
        value: ${{ jobs.signed.outputs.sha256 }}
      dmg_sha256:
        description: SHA-256 of Readout-<version>.dmg in the same artifact (notarized and stapled when notarizing)
        value: ${{ jobs.signed.outputs.dmg_sha256 }}

jobs:
  signed:
    name: Build, sign and smoke test
    runs-on: macOS-26
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
      dmg_sha256: ${{ steps.dmg.outputs.sha256 }}
    env:
      VERSION: ${{ inputs.version }}
      BUILD: ${{ inputs.build }}
      CONFIG: ${{ inputs.configuration }}
      # "true" only when asked for and every secret is there.
      NOTARIZE: ${{ inputs.notarize && secrets.DEVELOPER_ID_P12_BASE64 != '' && secrets.DEVELOPER_ID_P12_PASSWORD != '' && secrets.DEVELOPER_ID_IDENTITY != '' && secrets.NOTARY_API_KEY_P8_BASE64 != '' && secrets.NOTARY_API_KEY_ID != '' && secrets.NOTARY_API_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Select commit
        run: |
          if git rev-parse --verify --quiet "refs/tags/v$VERSION" >/dev/null; then
            git checkout "v$VERSION"
          else
            echo "No tag v$VERSION; verifying the current checkout ($GITHUB_SHA)."
          fi
          git rev-parse HEAD

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web renderer
        working-directory: web
        run: npm ci && npm run build

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Build (same parameters as Release)
        run: |
          set -o pipefail
          xcodebuild -project Readout.xcodeproj -scheme Readout -configuration "$CONFIG" \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | xcbeautify --renderer github-actions
          mkdir -p dist
          ditto build/Build/Products/"$CONFIG"/Readout.app dist/Readout.app

      - name: Sign (ad-hoc, hardened runtime)
        if: env.NOTARIZE != 'true'
        run: |
          echo "Notarization: ${{ inputs.notarize && 'asked for, but the signing secrets are not set: ad hoc' || 'not asked for: ad hoc' }}"
          chmod +x tools/sign.sh
          tools/sign.sh dist/Readout.app "-"

      - name: Import the Developer ID certificate (temporary keychain)
        if: env.NOTARIZE == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/readout-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # The temporary keychain first, the user's after it (one word each).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Sign (Developer ID, hardened runtime, timestamp)
        if: env.NOTARIZE == 'true'
        env:
          IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: |
          chmod +x tools/sign.sh
          tools/sign.sh dist/Readout.app "$IDENTITY"

      - name: Notarize and staple the app
        if: env.NOTARIZE == 'true'
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          ditto -c -k --keepParent dist/Readout.app "$RUNNER_TEMP/Readout-notarize.zip"
          sh tools/notarize.sh "$RUNNER_TEMP/Readout-notarize.zip" dist/Readout.app

      - name: The shipped app never writes the document
        run: |
          # File edits during the smoke test come from tools/smoke-run.py, not the app.
          # Allowlist: the only places the app may write files at all are the
          # smoke capture export (into READOUT_SMOKE_OUT) and the baseline store
          # (Application Support). Any other write API anywhere fails the build.
          WRITES='replaceItemAt|[^a-zA-Z]copyItem\(|[^a-zA-Z]moveItem\(|[^a-zA-Z]linkItem\(|createFile\(|removeItem\(at:|trashItem\(|\.write\(to:|\.write\(toFile:|write\(to: *[a-zA-Z]|forWritingTo|forWritingAtPath|forUpdating|fopen\(|open\(.*O_WRONLY|O_RDWR|NSFileCoordinator'
          if grep -rnE "$WRITES" App Shared QuickLook | grep -vE '^App/(SmokeTest|Settings)\.swift:'; then
            echo "FAIL: file-writing code outside App/SmokeTest.swift and App/Settings.swift (baseline store)"; exit 1
          fi
          if strings -a dist/Readout.app/Contents/MacOS/Readout | grep -E "READOUT_SMOKE_(EDIT|EARLY)|readout-smoke"; then
            echo "FAIL: the signed binary still carries smoke edit code"; exit 1
          fi
          echo "ok: no document writes in the product"

      - name: Smoke test the signed app from /Applications
        run: |
          rm -rf /Applications/Readout.app
          ditto dist/Readout.app /Applications/Readout.app
          python3 tools/smoke-run.py /Applications/Readout.app/Contents/MacOS/Readout "$RUNNER_TEMP/smoke" smoke-out

      - name: Quick Look check
        run: |
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/Readout.app
          pluginkit -a /Applications/Readout.app/Contents/PlugIns/ReadoutQuickLook.appex || true
          sleep 2
          pluginkit -mAvvv -p com.apple.quicklook.preview > smoke-out/ql-pluginkit.log 2>&1 || true
          cat smoke-out/ql-pluginkit.log
          # The extension serves the reader page from the app's
          # Contents/Resources/Web (F7): it ships no copy of its own.
          APPEX=/Applications/Readout.app/Contents/PlugIns/ReadoutQuickLook.appex
          if [ -e "$APPEX/Contents/Resources/Web" ]; then echo "FAIL: the Quick Look extension carries its own Web/"; exit 1; fi
          du -sk /Applications/Readout.app "$APPEX" /Applications/Readout.app/Contents/Resources/Web
          qlmanage -r >/dev/null 2>&1 || true
          START=$(date '+%Y-%m-%d %H:%M:%S')
          # Two previews, one after the other: the second may find the spare
          # page the first left in the extension (F6), if its process is still running.
          # The extension logs one line per preview with the rendered block
          # count: wait for it (up to ~20 s on a slow runner), not a fixed time.
          for N in 1 2; do
            (qlmanage -p "$RUNNER_TEMP/smoke/plan.md" >> smoke-out/qlmanage.log 2>&1 &)
            WAIT_END=$((SECONDS + 20))
            while :; do
              sleep 1
              log show --start "$START" --style compact \
                --predicate 'subsystem == "io.github.hxddh.readout.quicklook"' > smoke-out/ql-render.log 2>&1 || true
              if [ "$(grep -cE 'preview (applied|timed out): rendered' smoke-out/ql-render.log)" -ge "$N" ]; then
                echo "Quick Look preview $N logged"
                break
              fi
              if [ "$SECONDS" -ge "$WAIT_END" ]; then
                echo "Quick Look preview $N not logged within 20 s"
                break
              fi
            done
            sleep 2   # the spare page for the next preview is made after this one shows
            pkill -f qlmanage || true
            sleep 1
          done
          cat smoke-out/qlmanage.log || true
          cat smoke-out/ql-render.log
          # Reported, not gated: the extension's own time from request to apply,
          # and from its web view created (before the parse) to its page's ready;
          # the second preview's time, whether it took the spare page and ran in
          # the first one's process.
          python3 - smoke-out/ql-render.log smoke-out/ql-timings.json <<'EOF'
          import json, re, sys
          log = open(sys.argv[1]).read()
          out = {}
          opens = re.findall(r"\[(\d+):[0-9a-f]+\].*rendered -?\d+ of \d+ blocks in (\d+) ms", log)
          if opens:
              out["ql_open_ms"] = int(opens[0][1])
          if len(opens) > 1:
              out["ql_second_open_ms"] = int(opens[1][1])
              out["ql_second_same_process"] = opens[0][0] == opens[1][0]
          m = re.search(r"preview page ready in (\d+) ms", log)
          if m:
              out["ql_page_ready_ms"] = int(m.group(1))
          spare = re.findall(r"preview view created in \d+ ms \(spare page: (yes|no)\)", log)
          if len(spare) > 1:
              out["ql_second_used_spare"] = spare[1] == "yes"
          json.dump(out, open(sys.argv[2], "w"))
          EOF
          cat smoke-out/ql-timings.json
          # Informational: a preview-only extension does not provide thumbnails.
          qlmanage -t -s 512 -o smoke-out "$RUNNER_TEMP/smoke/plan.md" > smoke-out/qlthumb.log 2>&1 || true
          cat smoke-out/qlthumb.log

      - name: Core speed (release build, this runner)
        run: |
          READOUT_PERF_OUT="$PWD/smoke-out/perf-core.json" \
            swift test --package-path Packages/ReadoutCore -c release --filter PerformanceBudgetTests

      - name: Deepest documents on 512 KB stacks (release build)
        # The shipped build's frames: the capped documents parse on a GCD thread's stack (NestingCap).
        run: swift test --package-path Packages/ReadoutCore -c release --filter "theDeepestDocumentsFitASmallStack|indentedBulletLinesAreOneParagraph|deepNestingParsesOnASmallStack"

      - name: Speed budgets
        run: python3 tools/perf-assert.py mac smoke-out/perf-core.json smoke-out/timings.json smoke-out/ql-timings.json

      - name: Print smoke values
        if: always()
        run: |
          for f in smoke-out/*.json; do echo "== $f"; cat "$f"; echo; done
          # Each warm open's web process over 2 s (SmokeTest, spindump): its threads' call trees.
          for f in smoke-out/sample-warm-*.txt; do
            [ -f "$f" ] || continue
            echo "== $f"; awk '/^ *Thread 0x/{p=1} p' "$f" | cut -c1-220 | head -160
          done

      - name: Assert smoke output
        run: |
          # The licence notices About Readout links to, as built into the app.
          cp /Applications/Readout.app/Contents/Resources/Acknowledgements.md smoke-out/ || true
          python3 tools/smoke-assert.py smoke-out

      - name: Hash the signed app
        id: hash
        run: |
          (cd /Applications && ditto -c -k --keepParent Readout.app "$OLDPWD/readout-app-$VERSION.zip")
          SHA=$(shasum -a 256 "readout-app-$VERSION.zip" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA-256(readout-app-$VERSION.zip) = $SHA"

      - name: Gatekeeper's verdict on the app as downloaded
        run: |
          # A copy with the quarantine flag a browser download gets (the
          # installed app itself stays as hashed). Ad hoc today: "rejected";
          # once notarized: "accepted, source=Notarized Developer ID".
          rm -rf "$RUNNER_TEMP/gatekeeper" && mkdir -p "$RUNNER_TEMP/gatekeeper"
          ditto /Applications/Readout.app "$RUNNER_TEMP/gatekeeper/Readout.app"
          xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;" "$RUNNER_TEMP/gatekeeper/Readout.app"
          set +e
          VERDICT=$(spctl -a -t exec -vv "$RUNNER_TEMP/gatekeeper/Readout.app" 2>&1)
          CODE=$?
          set -e
          echo "spctl -a -t exec -vv (exit $CODE):"
          echo "$VERDICT"
          echo "$VERDICT" > smoke-out/gatekeeper.txt
          if [ "$NOTARIZE" = "true" ] && [ "$CODE" -ne 0 ]; then
            echo "FAIL: the notarized app is not accepted by Gatekeeper"; exit 1
          fi

      - name: Disk image (dmgbuild; Developer ID signed, notarized and stapled when notarizing)
        id: dmg
        env:
          IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          # Built here, from the tested app as hashed above, and checked below:
          # publish ships this disk image byte for byte (its SHA-256 is an output).
          # The layout comes from the workflow's own commit, so a dry run of an
          # older tag (release.yml) builds today's disk image around that tag's app.
          TOOLS="$RUNNER_TEMP/dmg-tools"
          rm -rf "$TOOLS" && mkdir -p "$TOOLS"
          for f in background.swift settings.py requirements.txt; do
            git show "$GITHUB_SHA:tools/dmg/$f" > "$TOOLS/$f"
          done
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/pip" install --quiet --require-hashes --only-binary :all: -r "$TOOLS/requirements.txt"
          "$RUNNER_TEMP/dmgbuild-venv/bin/dmgbuild" --help > /dev/null
          # The first-open hint only while the app is not notarized (Gatekeeper
          # opens a notarized one without System Settings).
          HINT=1
          if [ "$NOTARIZE" = "true" ]; then HINT=0; fi
          xcrun swift "$TOOLS/background.swift" "$TOOLS" "$HINT"
          rm -rf "$RUNNER_TEMP/dmg" && mkdir -p "$RUNNER_TEMP/dmg"
          ditto /Applications/Readout.app "$RUNNER_TEMP/dmg/Readout.app"
          "$RUNNER_TEMP/dmgbuild-venv/bin/dmgbuild" -s "$TOOLS/settings.py" \
            -D app="$RUNNER_TEMP/dmg/Readout.app" -D bg="$TOOLS/background.png" \
            Readout "Readout-$VERSION.dmg"
          if [ "$NOTARIZE" = "true" ]; then
            codesign --force --timestamp --sign "$IDENTITY" "Readout-$VERSION.dmg"
            sh tools/notarize.sh "Readout-$VERSION.dmg" "Readout-$VERSION.dmg"
            spctl -a -t open --context context:primary-signature -vv "Readout-$VERSION.dmg"
          fi
          SHA=$(shasum -a 256 "Readout-$VERSION.dmg" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA-256(Readout-$VERSION.dmg) = $SHA"

      - name: Check the disk image as it ships
        env:
          EXPECTED_DMG_SHA: ${{ steps.dmg.outputs.sha256 }}
        run: |
          DMG="Readout-$VERSION.dmg"
          hdiutil verify "$DMG"
          hdiutil attach -readonly -noautoopen -plist "$DMG" > "$RUNNER_TEMP/attach.plist"
          MNT=$(python3 -c 'import plistlib, sys; print(next(e["mount-point"] for e in plistlib.load(open(sys.argv[1], "rb"))["system-entities"] if e.get("mount-point")))' "$RUNNER_TEMP/attach.plist")
          echo "mounted at $MNT"
          ls -la "$MNT"
          fail() { echo "FAIL: $1"; hdiutil detach "$MNT" -force > /dev/null || true; exit 1; }
          [ "$(readlink "$MNT/Applications")" = "/Applications" ] || fail "no Applications link"
          [ -f "$MNT/.DS_Store" ] || fail "no Finder layout (.DS_Store)"
          [ -f "$MNT/.background.tiff" ] || fail "no background image"
          # dmgbuild combines background.png and background@2x.png into one
          # TIFF (a lone PNG would stay .background.png): one image per scale.
          tiffutil -info "$MNT/.background.tiff" || true
          IMAGES=$(python3 - "$MNT/.background.tiff" <<'EOF'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          order = "<" if data[:2] == b"II" else ">"
          offset, sizes = struct.unpack(order + "I", data[4:8])[0], []
          while offset:
              count = struct.unpack(order + "H", data[offset:offset + 2])[0]
              tags = {}
              for i in range(count):
                  tag, kind, _, value = struct.unpack(order + "HHII", data[offset + 2 + 12 * i:offset + 14 + 12 * i])
                  tags[tag] = value & 0xFFFF if kind == 3 and order == "<" else (value >> 16 if kind == 3 else value)
              sizes.append(f"{tags.get(256)}x{tags.get(257)}")
              offset = struct.unpack(order + "I", data[offset + 2 + 12 * count:offset + 6 + 12 * count])[0]
          print(" ".join(sizes))
          EOF
          )
          echo "background images: $IMAGES"
          [ "$IMAGES" = "600x420 1200x840" ] || fail "the background is not one 600 x 420 image at 1x and 2x ($IMAGES)"
          # The tested app, file for file, with the same signature.
          diff -r "$MNT/Readout.app" /Applications/Readout.app || fail "the app in the disk image is not the tested app"
          # Nothing outside the signature on the bundle (Finder information,
          # a resource fork): strict verification refuses it.
          xattr -l "$MNT/Readout.app" || true
          codesign --verify --deep --strict "$MNT/Readout.app" || fail "the app in the disk image does not verify"
          A=$(codesign -dvvv "$MNT/Readout.app" 2>&1 | grep '^CDHash='); B=$(codesign -dvvv /Applications/Readout.app 2>&1 | grep '^CDHash=')
          [ -n "$A" ] && [ "$A" = "$B" ] || fail "the app's signature differs ($A vs $B)"
          # What the reader sees on opening it (for a look, not asserted).
          open "$MNT" || true
          sleep 4
          screencapture -x smoke-out/dmg-window.png || true
          hdiutil detach "$MNT" -force > /dev/null || hdiutil detach "$MNT" -force
          # Nothing changed it since it was hashed.
          [ "$(shasum -a 256 "$DMG" | cut -d' ' -f1)" = "$EXPECTED_DMG_SHA" ] || { echo "FAIL: $DMG changed after it was hashed"; exit 1; }
          echo "ok: $DMG holds the tested app, its layout and its 2x background"

      - name: Remove the signing keychain and key
        if: always() && env.NOTARIZE == 'true'
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/developer-id.p12"

      - name: Upload signed app
        uses: actions/upload-artifact@v5
        with:
          name: readout-app-${{ inputs.version }}
          # The disk image publish ships, built and checked here.
          path: |
            readout-app-${{ inputs.version }}.zip
            Readout-${{ inputs.version }}.dmg
          if-no-files-found: error

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-${{ inputs.version }}
          path: smoke-out
