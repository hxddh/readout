name: Verify signed product

# Builds exactly what Release builds, signs it with tools/sign.sh, boots the
# signed app from /Applications, asserts on its smoke output, and uploads the
# signed app zip. Release publishes ONLY this artifact — it never rebuilds.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build:
        required: true
        type: string
      configuration:
        required: false
        default: Release
        type: string
    outputs:
      sha256:
        description: SHA-256 of the uploaded readout-app-<version>.zip
        value: ${{ jobs.signed.outputs.sha256 }}

jobs:
  signed:
    name: Build, sign and smoke test
    runs-on: macOS-26
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    env:
      VERSION: ${{ inputs.version }}
      BUILD: ${{ inputs.build }}
      CONFIG: ${{ inputs.configuration }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Select commit
        run: |
          if git rev-parse --verify --quiet "refs/tags/v$VERSION" >/dev/null; then
            git checkout "v$VERSION"
          else
            echo "No tag v$VERSION; verifying the current checkout ($GITHUB_SHA)."
          fi
          git rev-parse HEAD

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web renderer
        working-directory: web
        run: npm ci && npm run build

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Build (same parameters as Release)
        run: |
          set -o pipefail
          xcodebuild -project Readout.xcodeproj -scheme Readout -configuration "$CONFIG" \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | xcbeautify --renderer github-actions
          mkdir -p dist
          ditto build/Build/Products/"$CONFIG"/Readout.app dist/Readout.app

      - name: Sign (ad-hoc, hardened runtime)
        run: |
          chmod +x tools/sign.sh
          tools/sign.sh dist/Readout.app "-"

      - name: The shipped app never writes the document
        run: |
          # File edits during the smoke test come from tools/smoke-run.py, not the app.
          # Allowlist: the only places the app may write files at all are the
          # smoke capture export (into READOUT_SMOKE_OUT) and the baseline store
          # (Application Support). Any other write API anywhere fails the build.
          WRITES='replaceItemAt|[^a-zA-Z]copyItem\(|[^a-zA-Z]moveItem\(|[^a-zA-Z]linkItem\(|createFile\(|removeItem\(at:|trashItem\(|\.write\(to:|\.write\(toFile:|write\(to: *[a-zA-Z]|forWritingTo|forWritingAtPath|forUpdating|fopen\(|open\(.*O_WRONLY|O_RDWR|NSFileCoordinator'
          if grep -rnE "$WRITES" App Shared QuickLook | grep -vE '^App/(SmokeTest|Settings)\.swift:'; then
            echo "FAIL: file-writing code outside App/SmokeTest.swift and App/Settings.swift (baseline store)"; exit 1
          fi
          if strings -a dist/Readout.app/Contents/MacOS/Readout | grep -E "READOUT_SMOKE_(EDIT|EARLY)|readout-smoke"; then
            echo "FAIL: the signed binary still carries smoke edit code"; exit 1
          fi
          echo "ok: no document writes in the product"

      - name: Smoke test the signed app from /Applications
        run: |
          rm -rf /Applications/Readout.app
          ditto dist/Readout.app /Applications/Readout.app
          python3 tools/smoke-run.py /Applications/Readout.app/Contents/MacOS/Readout "$RUNNER_TEMP/smoke" smoke-out

      - name: Quick Look check
        run: |
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/Readout.app
          pluginkit -a /Applications/Readout.app/Contents/PlugIns/ReadoutQuickLook.appex || true
          sleep 2
          pluginkit -mAvvv -p com.apple.quicklook.preview > smoke-out/ql-pluginkit.log 2>&1 || true
          cat smoke-out/ql-pluginkit.log
          qlmanage -r >/dev/null 2>&1 || true
          START=$(date '+%Y-%m-%d %H:%M:%S')
          (qlmanage -p "$RUNNER_TEMP/smoke/plan.md" > smoke-out/qlmanage.log 2>&1 &)
          sleep 8
          pkill -f qlmanage || true
          sleep 1
          cat smoke-out/qlmanage.log || true
          # The extension logs one line per preview with the rendered block count.
          log show --start "$START" --style compact \
            --predicate 'subsystem == "io.github.hxddh.readout.quicklook"' > smoke-out/ql-render.log 2>&1 || true
          cat smoke-out/ql-render.log
          # Informational: a preview-only extension does not provide thumbnails.
          qlmanage -t -s 512 -o smoke-out "$RUNNER_TEMP/smoke/plan.md" > smoke-out/qlthumb.log 2>&1 || true
          cat smoke-out/qlthumb.log

      - name: Core speed (release build, this runner)
        run: |
          READOUT_PERF_OUT="$PWD/smoke-out/perf-core.json" \
            swift test --package-path Packages/ReadoutCore -c release --filter PerformanceBudgetTests

      - name: Speed budgets
        run: python3 tools/perf-assert.py mac smoke-out/perf-core.json smoke-out/timings.json

      - name: Print smoke values
        run: |
          for f in smoke-out/*.json; do echo "== $f"; cat "$f"; echo; done

      - name: Assert smoke output
        run: python3 tools/smoke-assert.py smoke-out

      - name: Hash the signed app
        id: hash
        run: |
          (cd /Applications && ditto -c -k --keepParent Readout.app "$OLDPWD/readout-app-$VERSION.zip")
          SHA=$(shasum -a 256 "readout-app-$VERSION.zip" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA-256(readout-app-$VERSION.zip) = $SHA"

      - name: Upload signed app
        uses: actions/upload-artifact@v5
        with:
          name: readout-app-${{ inputs.version }}
          path: readout-app-${{ inputs.version }}.zip

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-${{ inputs.version }}
          path: smoke-out
