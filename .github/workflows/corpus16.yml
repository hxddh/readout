name: Corpus render (temporary, #99)
on:
  push:
    branches: [exp/p4-corpus16]
jobs:
  corpus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build and install WebKit
        working-directory: web
        run: npm ci && npm run build && npx playwright install --with-deps webkit
      - name: Corpus
        working-directory: web
        run: npm run corpus
      - name: Deterministic (3 renders)
        if: success() || failure()
        working-directory: web
        run: node test/corpus.test.mjs --repeat=3 20-aios,21-dropout,29-a2a
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: corpus-actual
          path: web/test/out/corpus
