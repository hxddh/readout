name: Readout
options:
  bundleIdPrefix: io.github.hxddh
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "3.9.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO

packages:
  ReadoutCore:
    path: Packages/ReadoutCore

targets:
  Readout:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Help/**"]
      - path: Shared
      - path: web/build/Web
        type: folder
        buildPhase: resources
      - path: cli/readout
        buildPhase: resources
      # Help ▸ Readout Help opens these in Readout itself (Contents/Resources/Help).
      - path: App/Help
        type: folder
        buildPhase: resources
    dependencies:
      - package: ReadoutCore
      - target: ReadoutQuickLook
        embed: true
        codeSign: true
    # Readout ▸ About Readout links to Resources/Acknowledgements.md: the licences
    # of the npm and Swift packages inside the app (the web bundle drops their comments).
    postBuildScripts:
      - name: Third-party notices (Acknowledgements.md)
        basedOnDependencyAnalysis: false
        script: |
          python3 "$SRCROOT/tools/credits.py" --checkouts "$BUILD_DIR/../../SourcePackages/checkouts" \
            --out "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Acknowledgements.md"
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Readout
        CFBundleDisplayName: Readout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 hxddh"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # Shown when a document (or an agent folder) is in a protected folder.
        # Localized in App/<lang>.lproj/InfoPlist.strings.
        NSDocumentsFolderUsageDescription: Readout reads the Markdown files you open or add as agent folders here. It never changes them.
        NSDesktopFolderUsageDescription: Readout reads the Markdown files you open or add as agent folders here. It never changes them.
        NSDownloadsFolderUsageDescription: Readout reads the Markdown files you open or add as agent folders here, and saves the updates you download here. It never changes your files.
        # Settings ▸ Editor ▸ Xcode runs /usr/bin/xed, which asks Xcode over Apple Events to open the file at a line.
        NSAppleEventsUsageDescription: Readout asks Xcode to open a file at a line when Xcode is your editor.
        # `readout -b` / `readout --hook` open through readout-open://open?path=…&background=1.
        # Not `readout:`, which is the reader page's own scheme inside its web view.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.hxddh.readout.open
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [readout-open]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            CFBundleTypeIconSystemGenerated: 1
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
              - io.github.hxddh.readout.markdown
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.hxddh.readout.markdown
            UTTypeDescription: Markdown Document
            # Markdown under its less common extensions: still Markdown to
            # other apps (and to Quick Look), not only plain text.
            UTTypeConformsTo: [net.daringfireball.markdown, public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [mdown, mkd, mkdn, mdwn, mdtxt, mdtext]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hxddh.readout
        PRODUCT_NAME: Readout
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: App/Readout.entitlements

  ReadoutQuickLook:
    type: app-extension
    platform: macOS
    # No Web/ of its own: previews are served from the containing app's
    # Contents/Resources/Web (PreviewViewController.appBundle).
    sources:
      - path: QuickLook
      - path: Shared
    dependencies:
      - package: ReadoutCore
      - sdk: Quartz.framework
      - sdk: WebKit.framework
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleDisplayName: Readout Quick Look
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              - net.daringfireball.markdown
              - io.github.hxddh.readout.markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hxddh.readout.quicklook
        PRODUCT_NAME: ReadoutQuickLook
        CODE_SIGN_ENTITLEMENTS: QuickLook/QuickLook.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
